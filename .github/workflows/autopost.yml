name: Telegram NewsPic AutoPost

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run bot
        run: npm run start
        env:
          NEWSPIC_COOKIE: ${{ secrets.NEWSPIC_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_PRIVATE: ${{ secrets.TELEGRAM_CHAT_ID_PRIVATE }}


      # ✅ 상태 저장 커밋
      - name: Commit posted.json
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"

          if git status --porcelain | grep posted.json; then
            git add posted.json
            git commit -m "chore: update posted.json"
            git push
          else
            echo "No changes to commit"
          fi
