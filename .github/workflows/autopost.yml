name: Telegram NewsPic AutoPost

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore dedup cache
        uses: actions/cache@v4
        with:
          path: data
          key: newspic-dedup-${{ github.run_id }}
          restore-keys: |
            newspic-dedup-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

- name: Run bot
  run: npm run start
  env:
    TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}


      - name: Save dedup cache
        uses: actions/cache@v4
        with:
          path: data
          key: newspic-dedup-${{ github.run_id }}
