name: NewsPic Telegram AutoPost

on:
  schedule:
    # ⏰ 30분마다 실행 (UTC 기준)
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  autopost:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🟢 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 의존성 설치
        run: npm install

      - name: 🚀 뉴스픽 자동 업로드 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWSPIC_PARTNER_CODE: ${{ secrets.NEWSPIC_PARTNER_CODE }}
        run: npm run start
